<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ваша кофейня — Coffepoint</title><link rel="icon" href="/favicon.svg" />
<link rel="stylesheet" href="/src/styles.css" /><link rel="stylesheet" href="/src/app.css" />
<script type="module" src="/src/cafe.js"></script></head>
<body><header class="header wrap"><a class="brand" href="/">coffepoint.</a><nav class="app-nav" aria-label="Навигация"><a href="/#restaurants">Кофейни</a><a href="/booking.html">Бронирование</a><a data-account href="/profile.html">Личный кабинет</a></nav></header>
<main class="app-page wrap"><h1>Ваша кофейня</h1><p class="status" id="page-status" role="status" aria-live="polite">Загрузка…</p><div id="cafe-content" hidden><img id="cafe-image" class="cafe-cover" alt="" /><div class="split"><section class="panel"><h2 id="cafe-name"></h2><p id="cafe-description"></p><p id="cafe-address"></p><p id="cafe-meta"></p><a id="cafe-book" class="button">Забронировать</a></section><section class="panel"><h2>Столики</h2><p id="cafe-tables"></p><p>Актуальная занятость на выбранные дату и время отображается в форме бронирования.</p><h2>Напитки</h2><div id="cafe-drinks" class="list"></div><button class="button" id="drinks-more">Показать ещё</button></section></div>
<section class="panel"><h2>Отзывы гостей</h2><p id="review-average"></p><p id="review-login"><a class="text-link" href="/auth.html">Войдите, чтобы оставить отзыв</a></p>
<form id="review-form" class="stack narrow" hidden><label class="field">Ваша оценка<select id="review-rating"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label><label class="field">Ваш отзыв<textarea id="review-text" required minlength="3" maxlength="2000"></textarea></label><div class="actions"><button class="button" id="save-review">Сохранить отзыв</button><button class="button" type="button" id="delete-review" hidden>Удалить мой отзыв</button></div></form>
<div id="reviews" class="list"></div><button class="button" id="reviews-more">Показать ещё</button></section></div></main></body></html>
